name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build + unit tests
        run: ./gradlew --no-daemon test fatJar

      - name: Self-verify (obfuscate a sample jar and structurally verify it)
        run: |
          set -e
          mkdir -p ci/com/example
          cat > ci/com/example/Hello.java <<'EOF'
          package com.example;
          public class Hello {
              public static void main(String[] a) {
                  String s = "ci smoke test";
                  int n = 4321;
                  System.out.println(s + " " + (n * 2));
              }
              public int compute(int x) { return x * 7 + 3; }
          }
          EOF
          javac -d ci ci/com/example/Hello.java
          (cd ci && jar cfe hello.jar com.example.Hello com/example/Hello.class)
          JAR=$(ls build/libs/crazy-obfuscator-*-all.jar | head -1)
          java -jar "$JAR" ci/hello.jar ci/hello-obf.jar --root-package com.example --seed 1
          java -cp "$JAR" dev.crazy.obf.cli.Verify ci/hello-obf.jar
          OUT=$(java -jar ci/hello-obf.jar)
          echo "obfuscated output: $OUT"
          test "$OUT" = "ci smoke test 8642"

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: crazy-obfuscator
          path: build/libs/crazy-obfuscator-*-all.jar
          if-no-files-found: error
